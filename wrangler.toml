name = "cinescope-bot"
main = "src/index.js"
compatibility_date = "2026-11-20"
workers_dev = true

[vars]
AI_API_MODE = "google"
AI_API_BASE_URL = ""
GEMINI_MODEL = "gemini-4-hydrogen"
MAX_USER_KEYS = "5"
MAX_WATCHLIST_ITEMS = "30"

[[kv_namespaces]]
binding = "CINE_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[observability]
enabled = true
head_sampling_rate = 0.1
